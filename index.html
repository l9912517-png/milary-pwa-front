<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MILARY</title>

<link rel="icon" href="/pwa/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/pwa/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png">
<link rel="manifest" href="/pwa/manifest.json">

<link rel="preload" href="/pwa/fonts/golos-text.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="/pwa/fonts/fonts.css?v=1">

<link rel="stylesheet" href="/pwa/styles.css?v=3">
<link rel="stylesheet" href="/pwa/menu-groups.css?v=5">
<link rel="stylesheet" href="/pwa/ord/ord.css?v=21">
<link rel="stylesheet" href="/pwa/chk/chk.css?v=4">
<link rel="stylesheet" href="/pwa/theme.css?v=9">
<script src="/pwa/theme/theme.js?v=1"></script>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MILARY">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3D1D5C">
</head>

<body class="is-login">

<div id="app" class="app-wrapper">

    <!-- ШАПКА: на главной — логотип и кнопки, на остальных экранах — «назад» и название -->
    <header id="app-header" class="app-header is-home">
        <div class="header-content">

            <button type="button" class="header-back" aria-label="Назад" onclick="headerBack()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
            </button>

            <svg class="header-grapes header-grapes-home" viewBox="0 0 100 120" aria-hidden="true">
                <g fill="#B5E08A"><path d="M50 32 C 44 15, 28 10, 17 16 C 25 25, 37 31, 50 32 Z"/><path d="M50 32 C 52 15, 64 7, 78 10 C 72 21, 62 29, 50 32 Z"/></g>
                <path d="M68 22 C 76 17, 88 19, 88 28 C 88 35, 79 35, 80 29" fill="none" stroke="#B5E08A" stroke-width="4" stroke-linecap="round"/>
                <g fill="#FFFFFF" stroke="#3D1D5C" stroke-width="4"><circle cx="50" cy="98" r="14"/><circle cx="34" cy="72" r="15"/><circle cx="66" cy="72" r="15"/><circle cx="38" cy="47" r="13"/><circle cx="62" cy="47" r="13"/></g>
            </svg>

            <h1 id="screen-title" class="brand-title"></h1>

            <svg class="header-grapes header-grapes-inner" viewBox="0 0 100 120" aria-hidden="true">
                <g fill="#B5E08A"><path d="M50 32 C 44 15, 28 10, 17 16 C 25 25, 37 31, 50 32 Z"/><path d="M50 32 C 52 15, 64 7, 78 10 C 72 21, 62 29, 50 32 Z"/></g>
                <path d="M68 22 C 76 17, 88 19, 88 28 C 88 35, 79 35, 80 29" fill="none" stroke="#B5E08A" stroke-width="4" stroke-linecap="round"/>
                <g fill="#FFFFFF" stroke="#3D1D5C" stroke-width="4"><circle cx="50" cy="98" r="14"/><circle cx="34" cy="72" r="15"/><circle cx="66" cy="72" r="15"/><circle cx="38" cy="47" r="13"/><circle cx="62" cy="47" r="13"/></g>
            </svg>

            <button type="button" id="helpBtn" class="icon-btn header-help" aria-label="Как пользоваться этим экраном" title="Как пользоваться" onclick="openHelp()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-18 0a9 9 0 0 1 18 0 M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6 M12 17h.01"/></svg>
            </button>

            <div id="top-bar" class="header-actions hidden">
                <span id="user-name" class="user-name"></span>
                <button type="button" class="icon-btn" aria-label="Справка" title="Справка" onclick="openScreen('help')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-18 0a9 9 0 0 1 18 0 M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6 M12 17h.01"/></svg>
                </button>
                <button type="button" class="icon-btn" aria-label="Выход" title="Выход" onclick="logout()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4 M10 16l4-4-4-4 M14 12H3"/></svg>
                </button>
            </div>

        </div>

        <svg class="header-swoosh" viewBox="0 0 390 26" preserveAspectRatio="none" aria-hidden="true">
            <defs><linearGradient id="swHead" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#B5E08A" stop-opacity="0"/><stop offset="0.5" stop-color="#B5E08A"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.9"/></linearGradient></defs>
            <path d="M0 22 C 120 4, 260 2, 390 12" fill="none" stroke="url(#swHead)" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
            <path d="M30 25 C 150 10, 280 8, 390 18" fill="none" stroke="url(#swHead)" stroke-width="1.2" stroke-opacity="0.6" vector-effect="non-scaling-stroke"/>
        </svg>
    </header>


    <!-- MAIN CONTENT -->
    <main id="screen-container" class="screen-container"></main>


    <!-- НИЖНЯЯ ПАНЕЛЬ: Файлы · Главная · Сообщения -->
    <nav class="bottom-nav" aria-label="Нижнее меню">

        <button type="button" id="navFiles" class="bottom-btn" onclick="showFiles();setActive(this)">
            <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h6l2 2h10v10H3z"/></svg>
            <span>Файлы</span>
        </button>

        <button type="button" id="navHome" class="bottom-btn center-btn" onclick="goHome()" aria-label="Главная" title="Главная">
            <svg class="nav-svg nav-center" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z"/></svg>
        </button>

        <button type="button" id="navMessages" class="bottom-btn" onclick="showMessages();setActive(this)">
            <div class="icon-wrapper">
                <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V5a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>
                <span id="messagesBadge" class="badge hidden"></span>
            </div>
            <span>Сообщения</span>
        </button>

    </nav>

</div>



<!-- APP -->
<script src="/pwa/errors/errors.js?v=1"></script>
<script src="/pwa/app.js?v=53"></script>
<script src="/pwa/help/help.js?v=2"></script>
<script src="/pwa/support/support.js?v=4"></script>
<script src="/pwa/install/install.js?v=1"></script>
<script src="/pwa/invite/invite.js?v=2"></script>
<script src="/pwa/devices/devices.js?v=1"></script>
<script src="/pwa/announce/announce.js?v=1"></script>
<script src="/pwa/files/share.js?v=1"></script>





<!-- Заказ текстом (каталог /pwa/ord/, экраны screens/ord_*.js) -->
<script src="/pwa/ord/ord.js?v=23"></script>
<script src="/pwa/chk/chk.js?v=4"></script>


<!-- service worker регистрирует app.js -->

</body>
</html>
