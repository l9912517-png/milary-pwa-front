<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3D1D5C">
<title>MILARY — нет подключения</title>
<style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
        background: linear-gradient(180deg, #3D1D5C 0%, #1C0E2B 45%);
        color: #FFFFFF;
        font-family: "Golos Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center;
        padding: 24px;
    }
    .box { max-width: 360px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    h1 { font-size: 22px; font-weight: 700; }
    p { font-size: 15px; line-height: 1.5; color: #D3C6E2; }
    button {
        margin-top: 8px;
        min-width: 200px; height: 52px;
        border: none; border-radius: 16px;
        background: #B5E08A; color: #1C0E2B;
        font: inherit; font-size: 16px; font-weight: 700;
        cursor: pointer;
    }
    button:focus-visible { outline: 2px solid #B5E08A; outline-offset: 3px; }
</style>
</head>
<body>
<main class="box">
    <svg width="72" height="86" viewBox="0 0 100 120" aria-hidden="true">
        <g fill="#B5E08A"><path d="M50 32 C 44 15, 28 10, 17 16 C 25 25, 37 31, 50 32 Z"/><path d="M50 32 C 52 15, 64 7, 78 10 C 72 21, 62 29, 50 32 Z"/></g>
        <path d="M68 22 C 76 17, 88 19, 88 28 C 88 35, 79 35, 80 29" fill="none" stroke="#B5E08A" stroke-width="4" stroke-linecap="round"/>
        <g fill="#FFFFFF" stroke="#3D1D5C" stroke-width="4"><circle cx="50" cy="98" r="14"/><circle cx="34" cy="72" r="15"/><circle cx="66" cy="72" r="15"/><circle cx="38" cy="47" r="13"/><circle cx="62" cy="47" r="13"/></g>
    </svg>
    <h1>Нет подключения</h1>
    <p>MILARY не может связаться с сервером. Проверьте интернет и попробуйте ещё раз.</p>
    <button type="button" onclick="location.href='/pwa/'">Повторить</button>
</main>
<script>
    // связь вернулась — открываем приложение сами
    window.addEventListener("online", function () { location.href = "/pwa/"; });
</script>
</body>
</html>
